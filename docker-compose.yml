name: tienda_componentes
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - tienda_network

  nginx:
    image: nginx:alpine
    container_name: tienda_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tienda_network

  db:
    image: mysql:8.0
    container_name: tienda_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tienda_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: tienda_user
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - tienda_network

volumes:
  dbdata:

networks:
  tienda_network:
    driver: bridge